name: Update Saad Money
# Retired 2026-10-01: the v2 app (v2/) is fed directly from bank SMS via Supabase.
# The nightly Gmail sync no longer runs on a schedule; it can still be fired by hand if ever needed.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: saad-money-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync from Gmail and update app
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python update_app.py
