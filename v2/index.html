<script>
const BUILD = "2026-10-01a";
const SB_URL = "https://ywdetjwnopnwcrnuoblp.supabase.co";
const SB_KEY = "sb_publishable_bJyqlS50Bk4leVrxLyhZag_9wkkuYsN";   // publishable: safe in public code, RLS does the guarding
const sb = supabase.createClient(SB_URL, SB_KEY);
const DAY = 86400000;

let D = null;                 // loaded data
let tab = "home";             // home | activity | budgets | settings
let actOffset = 0;            // 0 = this cycle, -1 = last cycle, …
let actQuery = "";
let lastSync = null;          // Date of the last successful load or realtime event
let undoStack = null;         // { msg, fn }

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n) => (Math.abs(n) < 100 && n % 1 ? fmt(n, 2) : fmt(n));
const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const dshort = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const tshort = (d) => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const normPayee = (s) => String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); // same as ingest
const INFLOW = ["salary", "income", "transfer_in"];
const KIND_ICON = { salary: "💵", income: "💸", transfer_out: "🔁", transfer_in: "🔁", ignore: "🚫", commitment: "✅" };
const SVG = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  pie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>',
  search: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5d6f85" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};

// Payday on the given day-of-month, moved off the weekend (Fri → Thu, Sat → Sun) — same rule as v1.
function paydayIn(y, m, day) {
  let p = new Date(y, m, day);
  if (p.getDay() === 5) p = new Date(y, m, day - 1);
  if (p.getDay() === 6) p = new Date(y, m, day + 1);
  return p;
}
function lastPayday(d, day) {
  let p = paydayIn(d.getFullYear(), d.getMonth(), day);
  if (p > d) p = paydayIn(d.getFullYear(), d.getMonth() - 1, day);
  return p;
}
function nextPayday(d, day) {
  let p = paydayIn(d.getFullYear(), d.getMonth(), day);
  if (p <= d) p = paydayIn(d.getFullYear(), d.getMonth() + 1, day);
  return p;
}
// The cycle starts at the salary when it has landed (even a few days early or late), else on the nominal payday.
function cycle(txs, day) {
  const today = midnight(new Date());
  let start = lastPayday(today, day);
  const sal = txs.filter((t) => t.kind === "salary").map((t) => midnight(new Date(t.occurred_at))).sort((a, b) => b - a)[0];
  if (sal && sal >= addDays(start, -7) && sal <= today) start = sal;
  const end = nextPayday(addDays(start, 8), day);
  return { start, end, today };
}
// Bounds of an earlier cycle: walk back one payday at a time from the current start.
function cycleAt(offset) {
  const day = Number(D.settings.payday_day || 27);
  let { start, end } = D.cyc;
  for (let i = 0; i > offset; i--) { end = start; start = lastPayday(addDays(start, -1), day); }
  return { start, end };
}
const spendOf = (t) => (t.kind === "spend" ? Number(t.amount) + Number(t.fee || 0) : 0);
const inCycle = (t, c) => { const d = new Date(t.occurred_at); return d >= c.start && d < c.end; };

// ---------- data ----------
async function load() {
  const since = addDays(new Date(), -400).toISOString();
  const [acc, bud, com, set, tx] = await Promise.all([
    sb.from("accounts").select("*").order("sort"),
    sb.from("budgets").select("*").order("sort"),
    sb.from("commitments").select("*").order("sort"),
    sb.from("settings").select("*"),
    sb.from("transactions").select("*, raw_alerts(text)").gte("occurred_at", since).order("occurred_at", { ascending: false }).limit(2000),
  ]);
  const err = acc.error || bud.error || com.error || set.error || tx.error;
  if (err) throw err;
  const settings = {};
  for (const r of set.data) settings[r.key] = r.value;
  D = { accounts: acc.data, budgets: bud.data, commitments: com.data, settings, txs: tx.data };
  D.cyc = cycle(D.txs, Number(settings.payday_day || 27));
  // OTP codes and the like are stored (kind=ignore, amount 0) but never worth a row in a list.
  D.txs = D.txs.filter((t) => !(t.kind === "ignore" && Number(t.amount) === 0));
  D.cycTx = D.txs.filter((t) => new Date(t.occurred_at) >= D.cyc.start);
  lastSync = new Date();
}

function compute() {
  const { start, end, today } = D.cyc;
  const weekIdx = Math.floor((today - start) / DAY / 7);
  const weekStart = addDays(start, weekIdx * 7);
  const daysToEnd = Math.max(1, Math.round((end - weekStart) / DAY));
  const weekLen = Math.min(7, daysToEnd);
  const weekEnd = addDays(weekStart, weekLen);
  const pot = D.budgets.reduce((s, b) => s + Number(b.cap), 0);
  let before = 0, week = 0;
  for (const t of D.cycTx) {
    const d = new Date(t.occurred_at), v = spendOf(t);
    if (d < weekStart) before += v; else week += v;
  }
  // Whatever is left of the month's budget, spread evenly over the days remaining; overspend carries forward.
  const allowance = Math.max(0, pot - before) * weekLen / daysToEnd;
  const left = allowance - week;
  // Week-by-week view of the same rule: each week gets an even share of whatever is still unspent,
  // so under-spending one week flows into the next ones and over-spending is paid back the same way.
  const totalDays = Math.max(1, Math.round((end - start) / DAY));
  const weeks = [];
  let spentBefore = 0;
  for (let i = 0; i < Math.ceil(totalDays / 7); i++) {
    const ws = addDays(start, i * 7), daysFrom = Math.max(1, Math.round((end - ws) / DAY)), len = Math.min(7, daysFrom), we = addDays(ws, len);
    const spent = D.cycTx.reduce((s, t) => { const d = new Date(t.occurred_at); return d >= ws && d < we ? s + spendOf(t) : s; }, 0);
    const allow = Math.max(0, pot - spentBefore) * len / daysFrom;
    weeks.push({ no: i + 1, ws, we, len, allow, spent, left: allow - spent, current: i === weekIdx, future: ws > today });
    spentBefore += spent;
  }
  const base = pot * weekLen / totalDays;   // what this week would get with no carry-over at all
  const carry = allowance - base;
  const daysLeftWeek = Math.max(1, Math.round((weekEnd - today) / DAY));
  const byBudget = {};
  for (const t of D.cycTx) if (t.kind === "spend") byBudget[t.budget_id || "_"] = (byBudget[t.budget_id || "_"] || 0) + spendOf(t);
  const paid = {};
  for (const t of D.cycTx) if (t.kind === "commitment" && t.commitment_id) (paid[t.commitment_id] ||= []).push(t);
  const review = D.txs.filter((t) => !t.confirmed);
  const salTx = D.cycTx.filter((t) => t.kind === "salary").reduce((s, t) => s + Number(t.amount), 0);
  const income = (salTx || Number(D.settings.salary || 0)) + D.cycTx.filter((t) => t.kind === "income").reduce((s, t) => s + Number(t.amount), 0);
  const out = D.cycTx.filter((t) => t.kind === "spend" || t.kind === "commitment").reduce((s, t) => s + Number(t.amount) + Number(t.fee || 0), 0);
  const billsLeft = D.commitments.filter((c) => !paid[c.id]).reduce((s, c) => s + Number(c.amount), 0);
  const month = { income, out, billsLeft, left: income - out, free: income - out - billsLeft, days: Math.max(1, Math.round((end - today) / DAY)) };
  const weekNo = weekIdx + 1;
  return { weekStart, weekEnd, weekNo, allowance, left, week, daysLeftWeek, pot, byBudget, paid, review, month, weeks, base, carry, spentCycle: before + week };
}

// ---------- render ----------
function render() {
  if (!D) return;
  const C = compute();
  const { start, end } = D.cyc;
  let h = `<div class="top"><div><h1>${tab === "home" ? "Saad Money" : { activity: "Activity", budgets: "Budgets", settings: "Settings" }[tab]}</h1>
    <div class="cyc">${dshort(start)} – ${dshort(addDays(end, -1))}  ·  ${C.month.days} day${C.month.days > 1 ? "s" : ""} to payday</div></div>
    <div class="icons"><button class="ibtn" onclick="openAdd()" aria-label="Add spend">${SVG.plus}</button>
    <button class="ibtn" onclick="go('settings')" aria-label="Settings">${SVG.gear}</button></div></div><div class="wrap">`;
  h += { home: renderHome, activity: renderActivity, budgets: renderBudgets, settings: renderSettings }[tab](C);
  h += `</div>`;
  $("app").innerHTML = h;
  $("tabs").hidden = false;
  $("tabs").innerHTML = [["home", "Home", SVG.home], ["activity", "Activity", SVG.list], ["budgets", "Budgets", SVG.pie], ["settings", "Settings", SVG.gear]]
    .map(([id, l, ic]) => `<button class="${tab === id ? "on" : ""}" onclick="go('${id}')">${ic}${l}</button>`).join("");
}
function go(t) { if (t !== tab) window.scrollTo(0, 0); tab = t; render(); }

function renderHome(C) {
  let h = "";
  if (C.review.length) {
    const names = C.review.slice(0, 2).map((t) => `${esc(t.counterparty || label(t))} ${money(Number(t.amount))}`).join(" · ");
    h += `<button class="banner" onclick="openReview()"><i></i><div class="l"><div class="t">${C.review.length} payment${C.review.length > 1 ? "s" : ""} need${C.review.length > 1 ? "" : "s"} a tap</div>
      <div class="s"><bdi>${names}</bdi></div></div><span class="arr">›</span></button>`;
  }
  const tone = C.left <= 0 ? "bad" : C.left < C.allowance * 0.35 ? "warn" : "good";
  const pct = C.allowance ? Math.min(100, (C.week / C.allowance) * 100) : 100;
  const bcol = { good: "var(--green)", warn: "var(--amber)", bad: "var(--red)" }[tone];
  h += `<div class="card hero" onclick="openWeek()"><div class="hh"><span class="eyebrow">Left this week</span><span class="chip">Week ${C.weekNo} · ${dshort(C.weekStart)} – ${dshort(addDays(C.weekEnd, -1))}</span></div>
    <div class="big"><b class="${tone}">${fmt(C.left)}</b><span>SAR</span></div>
    <div class="bar h10"><i style="width:${pct}%;background:${bcol}"></i></div>
    ${Math.abs(C.carry) >= 1 ? `<div class="sub" style="font-size:12px;color:var(--sub);margin-top:8px">Base ${fmt(C.base)} ${C.carry > 0 ? `<b class="good">+ ${fmt(C.carry)}</b> carried over from earlier weeks` : `<b class="bad">− ${fmt(-C.carry)}</b> paid back for earlier weeks`}</div>` : ""}
    <div class="stats"><div class="stat"><b>${C.left > 0 ? fmt(C.left / C.daysLeftWeek) : "0"}</b><span>per day</span></div>
    <div class="stat"><b>${C.daysLeftWeek}</b><span>day${C.daysLeftWeek > 1 ? "s" : ""} left</span></div>
    <div class="stat"><b>${fmt(C.week)}</b><span>spent of ${fmt(C.allowance)}</span></div></div></div>`;

  const M = C.month, mtone = M.free < 0 ? "bad" : M.free < M.income * 0.05 ? "warn" : "good";
  h += `<div class="card"><div class="hh"><div><div style="font-size:15px;font-weight:600">Rest of the month</div><div class="sub" style="font-size:12px;color:var(--sub)">after ${fmt(M.billsLeft)} still to pay · ≈ ${fmt(Math.max(0, M.free) / M.days)} a day</div></div>
    <div style="display:flex;align-items:baseline;gap:6px"><b class="${mtone}" style="font-size:26px;letter-spacing:-.02em">${fmt(M.free)}</b><span style="font-size:13px;color:var(--sub);font-weight:500">free</span></div></div>
    <div class="bar h6" style="margin-top:12px"><i style="width:${M.income ? Math.min(100, (M.out / M.income) * 100) : 0}%;background:var(--teal)"></i></div>
    <div class="cmp"><span>In <b style="color:var(--ink)">${fmt(M.income)}</b></span><span>Out <b style="color:var(--ink)">${fmt(M.out)}</b></span><span>Left <b style="color:var(--ink)">${fmt(M.left)}</b></span></div></div>`;

  h += `<div class="sec"><div class="head"><h2>Budgets</h2><span>${fmt(C.spentCycle)} of ${fmt(C.pot)}</span></div><div class="grid">`;
  for (const b of D.budgets) h += tile(b, C.byBudget[b.id] || 0);
  if (C.byBudget._) h += tile({ id: "_", name: "Unsorted", icon: "❔", cap: 0 }, C.byBudget._);
  h += `</div></div>`;

  const nPaid = D.commitments.filter((c) => C.paid[c.id]).length;
  h += `<div class="sec"><div class="head"><h2>Commitments</h2><span>${nPaid} of ${D.commitments.length} paid</span></div><div class="card list">`;
  for (const c of D.commitments) h += commitRow(c, C.paid[c.id] || []);
  h += `</div></div>`;

  h += `<div class="sec"><div class="head"><h2>Activity</h2><button onclick="go('activity')">See all ›</button></div><div class="card list">`;
  h += grouped(D.cycTx.slice(0, 6), "Nothing yet. New bank SMS appear here within seconds.");
  h += `</div></div>`;
  return h;
}
function tile(b, s) {
  const p = b.cap ? s / b.cap : 0;
  const col = p >= 1 ? "var(--red)" : p >= 0.8 ? "var(--amber)" : "var(--green)";
  return `<button class="tile" onclick="openBudget('${b.id}')"><div class="tt"><div class="ico">${esc(b.icon || "•")}</div>${esc(b.name)}</div>
    <div class="amt"><b>${fmt(s)}</b><span>/ ${fmt(b.cap)}</span></div><div class="bar h5"><i style="width:${Math.min(100, p * 100)}%;background:${col}"></i></div></button>`;
}
function commitRow(c, ps) {
  const sum = ps.reduce((s, t) => s + Number(t.amount), 0);
  const auto = ps.some((t) => t.source !== "me");
  return `<div class="row ${ps.length ? "done" : ""}" onclick="tapCommit('${c.id}')"><div class="chk ${ps.length ? (auto ? "auto" : "on") : ""}">${ps.length ? "✓" : ""}</div>
    <div class="l"><div class="t">${esc(c.name)}</div>${ps.length ? `<div class="s">${auto ? "from bank" : "marked by you"}${ps.length > 1 ? ` · ${ps.length} payments` : ""}</div>` : ""}</div>
    <div class="r">${fmt(ps.length ? sum : c.amount)}</div></div>`;
}
function dayName(d) {
  const t = midnight(new Date()), x = midnight(d);
  if (x.getTime() === t.getTime()) return "Today";
  if (x.getTime() === addDays(t, -1).getTime()) return "Yesterday";
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function grouped(list, emptyMsg) {
  if (!list.length) return `<div class="empty">${emptyMsg}</div>`;
  let h = "", last = null;
  for (const t of list) {
    const dn = dayName(new Date(t.occurred_at));
    if (dn !== last) { h += `<div class="day">${dn}</div>`; last = dn; }
    h += txRow(t);
  }
  return h;
}
function label(t) {
  if (t.kind === "spend") return D.budgets.find((b) => b.id === t.budget_id)?.name || "Unsorted";
  if (t.kind === "commitment") return D.commitments.find((c) => c.id === t.commitment_id)?.name || "Commitment";
  return { salary: "Salary", income: "Money in", transfer_out: "To own account", transfer_in: "From own account", ignore: "Ignored" }[t.kind];
}
function iconOf(t) {
  if (t.kind === "spend") return D.budgets.find((b) => b.id === t.budget_id)?.icon || "❔";
  return KIND_ICON[t.kind] || "•";
}
function txRow(t) {
  const d = new Date(t.occurred_at);
  const inflow = INFLOW.includes(t.kind);
  const amt = Number(t.amount) + (t.kind === "spend" ? Number(t.fee || 0) : 0);
  const minor = ["transfer_out", "transfer_in", "ignore"].includes(t.kind);
  const sub = [t.confirmed ? "" : "Guess: ", esc(t.label || label(t)), tshort(d)].filter(Boolean).join(" · ").replace(": · ", ": ");
  return `<div class="row ${minor ? "minor" : ""}" onclick="openTx(${t.id})"><div class="ico lg">${iconOf(t)}</div><div class="l">
    <div class="t"><bdi>${esc(t.counterparty || label(t))}</bdi></div><div class="s">${sub}</div></div>
    <div class="r ${inflow ? "good" : ""}">${inflow ? "+" : "−"}${money(amt)}</div></div>`;
}

function renderActivity(C) {
  const c = cycleAt(actOffset);
  let list = D.txs.filter((t) => inCycle(t, c));
  const q = actQuery.trim().toLowerCase();
  if (q) list = list.filter((t) => [t.counterparty, t.label, label(t), t.note, String(t.amount)].some((x) => String(x || "").toLowerCase().includes(q)));
  const spent = list.reduce((s, t) => s + spendOf(t), 0);
  const inflow = list.filter((t) => INFLOW.includes(t.kind)).reduce((s, t) => s + Number(t.amount), 0);
  return `<div class="pick"><button onclick="actOffset--;render()">‹</button><b>${dshort(c.start)} – ${dshort(addDays(c.end, -1))}</b><button onclick="actOffset++;render()" ${actOffset >= 0 ? "disabled" : ""}>›</button></div>
    <div class="search">${SVG.search}<input id="q" placeholder="Search payee, budget, amount" value="${esc(actQuery)}" oninput="actQuery=this.value;render();$('q').focus();$('q').setSelectionRange(99,99)"></div>
    <div class="cmp" style="margin:0"><span>${list.length} transactions</span><span>spent <b style="color:var(--ink)">${fmt(spent)}</b></span><span>in <b style="color:var(--ink)">${fmt(inflow)}</b></span></div>
    <div class="card list">${grouped(list, q ? "No matches." : "Nothing in this cycle.")}</div>
    <div class="sync">${syncText()}</div>`;
}
function syncText() {
  if (!lastSync) return "";
  const s = Math.round((Date.now() - lastSync) / 1000);
  return "synced " + (s < 5 ? "just now" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`);
}

function renderBudgets(C) {
  const prev = cycleAt(-1);
  const prevBy = {};
  for (const t of D.txs) if (t.kind === "spend" && inCycle(t, prev)) prevBy[t.budget_id || "_"] = (prevBy[t.budget_id || "_"] || 0) + spendOf(t);
  const dayFrac = Math.max(0.05, (D.cyc.today - D.cyc.start) / (D.cyc.end - D.cyc.start));
  let h = `<div class="card"><div class="hh"><div><div style="font-size:15px;font-weight:600">This cycle</div><div class="sub" style="font-size:12px;color:var(--sub)">${Math.round(dayFrac * 100)}% of the month gone</div></div>
    <div style="display:flex;align-items:baseline;gap:6px"><b style="font-size:26px;letter-spacing:-.02em">${fmt(C.spentCycle)}</b><span style="font-size:13px;color:var(--sub)">of ${fmt(C.pot)}</span></div></div>
    <div class="bar h6" style="margin-top:12px"><i style="width:${C.pot ? Math.min(100, C.spentCycle / C.pot * 100) : 0}%;background:${C.spentCycle / C.pot > dayFrac ? "var(--amber)" : "var(--green)"}"></i></div>
    <div class="cmp"><span>last cycle at this point: about <b style="color:var(--ink)">${fmt(Object.values(prevBy).reduce((a, b) => a + b, 0) * dayFrac)}</b></span></div></div><div class="sec">`;
  for (const b of [...D.budgets, ...(C.byBudget._ ? [{ id: "_", name: "Unsorted", icon: "❔", cap: 0 }] : [])]) {
    const s = C.byBudget[b.id] || 0, p = b.cap ? s / b.cap : 0, pv = prevBy[b.id] || 0;
    const col = p >= 1 ? "var(--red)" : p >= 0.8 ? "var(--amber)" : "var(--green)";
    const diff = pv ? Math.round((s - pv) / pv * 100) : null;
    h += `<button class="card" style="width:100%" onclick="openBudget('${b.id}')"><div class="hh"><div class="tt" style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600"><div class="ico">${esc(b.icon || "•")}</div>${esc(b.name)}</div>
      <div class="amt" style="display:flex;align-items:baseline;gap:4px"><b style="font-size:20px;letter-spacing:-.02em">${fmt(s)}</b><span style="font-size:12px;color:var(--sub)">${b.cap ? "/ " + fmt(b.cap) : ""}</span></div></div>
      <div class="bar h5" style="margin-top:10px"><i style="width:${Math.min(100, p * 100)}%;background:${col}"></i></div>
      <div class="cmp"><span>last cycle ${fmt(pv)}</span><span>${diff === null ? "" : `<b style="color:${diff > 0 ? "var(--amber)" : "var(--green)"}">${diff > 0 ? "+" : ""}${diff}%</b> vs last`}</span></div></button>`;
  }
  return h + `</div>`;
}

function renderSettings() {
  const sal = Number(D.settings.salary || 0);
  const com = D.commitments.reduce((s, c) => s + Number(c.amount), 0);
  const bud = D.budgets.reduce((s, b) => s + Number(b.cap), 0);
  const free = sal - com - bud;
  return `<div class="card"><div class="lbl" style="margin-top:0">Salary</div><input id="s_salary" type="number" inputmode="decimal" value="${sal}">
    <div class="lbl">Budgets (monthly)</div>
    ${D.budgets.map((b) => `<div class="grid2"><input id="bn_${b.id}" value="${esc(b.name)}"><input id="bc_${b.id}" type="number" inputmode="decimal" value="${Number(b.cap)}"></div>`).join("")}
    <div class="lbl">Commitments (monthly)</div>
    ${D.commitments.map((c) => `<div class="grid2"><input id="cn_${c.id}" value="${esc(c.name)}"><input id="ca_${c.id}" type="number" inputmode="decimal" value="${Number(c.amount)}"></div>`).join("")}
    <div class="sub" style="margin-top:10px;font-size:13px;color:var(--sub)">Salary ${fmt(sal)} − commitments ${fmt(com)} − budgets ${fmt(bud)} = <b class="${free < 0 ? "bad" : "good"}">${fmt(free)}</b> ${free < 0 ? "over-planned" : "left unplanned (savings)"}</div>
    <button class="pbtn" onclick="saveSettings()">Save</button></div>
    <div class="card"><button class="pbtn ghost" style="margin-top:0" onclick="changePassword()">Change password</button>
    <button class="pbtn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Sign out</button>
    <div class="sub" style="margin-top:14px;text-align:center;font-size:12px;color:var(--sub)">Build ${BUILD} · ${syncText()}</div></div>`;
}

// ---------- sheets ----------
function openSheet(html) { $("sheet").innerHTML = `<div class="grab"></div>` + html; $("sheet").classList.add("on"); $("veil").classList.add("on"); $("sheet").scrollTop = 0; }
function closeSheet() { $("sheet").classList.remove("on"); $("veil").classList.remove("on"); }

let pick = null; // pending choice in the tap sheet: { kind, budget_id, commitment_id, text }
function openTx(id) {
  const t = D.txs.find((x) => x.id === id);
  if (!t) return;
  const inflow = INFLOW.includes(t.kind);
  pick = { kind: t.kind, budget_id: t.budget_id || null, commitment_id: t.commitment_id || null, text: label(t) };
  const d = new Date(t.occurred_at);
  const acc = D.accounts.find((a) => a.id === t.account_id)?.name || "";
  const opt = (k, b, c, txt) => `<button class="opt ${pick.kind === k && pick.budget_id === b && pick.commitment_id === c ? "sel" : ""}" onclick="setPick(${id},'${k}',${b ? `'${b}'` : null},${c ? `'${c}'` : null},this)">${txt}</button>`;
  const pill = (k, b, c, txt) => `<button class="pill ${pick.kind === k && pick.budget_id === b && pick.commitment_id === c ? "sel" : ""}" onclick="setPick(${id},'${k}',${b ? `'${b}'` : null},${c ? `'${c}'` : null},this)">${txt}</button>`;
  let h = `<div class="title"><div class="ico">${iconOf(t)}</div><div class="l"><h3><bdi>${esc(t.counterparty || label(t))}</bdi></h3>
    <div class="sub">${acc ? acc + " · " : ""}${dayName(d)} ${tshort(d)}${t.confirmed ? "" : " · guess: " + esc(label(t))}${t.label ? " · " + esc(t.label) : ""}${t.fee > 0 ? ` · fee ${t.fee}` : ""}</div></div>
    <div class="amt ${inflow ? "good" : ""}">${inflow ? "+" : ""}${money(Number(t.amount))}</div></div>`;
  if (t.raw_alerts?.text) h += `<div class="sms">${esc(t.raw_alerts.text)}</div>`;
  if (!inflow) {
    h += `<div class="lbl">Spent on</div><div class="opts">${D.budgets.map((b) => opt("spend", b.id, null, `<span>${esc(b.icon || "")}</span>${esc(b.name)}`)).join("")}
      <button class="opt ${t.label ? "sel" : ""}" onclick="describe(${id})"><span>✏️</span>Something else…</button></div>`;
    h += `<div class="lbl">Paid a commitment</div><div class="pills">${D.commitments.map((c) => pill("commitment", null, c.id, esc(c.name))).join("")}</div>`;
  }
  h += `<div class="lbl">Other</div><div class="pills">${pill(inflow ? "transfer_in" : "transfer_out", null, null, "My own account")}
    ${inflow ? pill("income", null, null, "Money in") + pill("salary", null, null, "Salary") : ""}${pill("ignore", null, null, "Ignore")}</div>`;
  if (t.counterparty) h += `<div class="toggle"><span>Always do this for “<bdi>${esc(t.counterparty)}</bdi>”</span><div class="sw ${/^Top-up/.test(t.counterparty) ? "" : "on"}" id="remember" onclick="this.classList.toggle('on');haptic()"></div></div>`;
  h += `<button class="pbtn" id="saveBtn" onclick="applyPick(${id})" disabled>Save</button>`;
  if (t.source === "me") h += `<button class="pbtn danger" onclick="delTx(${id})">Delete this entry</button>`;
  openSheet(h);
}
function setPick(id, kind, budget_id, commitment_id, el) {
  pick = { kind, budget_id, commitment_id, text: el.textContent.trim() };
  document.querySelectorAll("#sheet .opt,#sheet .pill").forEach((e) => e.classList.remove("sel"));
  el.classList.add("sel"); haptic();
  const b = $("saveBtn"); b.disabled = false; b.textContent = "Save — " + pick.text;
}
async function applyPick(id) {
  const t = D.txs.find((x) => x.id === id);
  const remember = $("remember")?.classList.contains("on");
  const prev = { kind: t.kind, budget_id: t.budget_id, commitment_id: t.commitment_id, label: t.label, confirmed: t.confirmed, confidence: t.confidence };
  closeSheet();
  const { error } = await sb.from("transactions").update({ kind: pick.kind, budget_id: pick.budget_id, commitment_id: pick.commitment_id, label: null, confirmed: true, confidence: 1 }).eq("id", id);
  if (error) return alert("Couldn't save: " + error.message);
  if (remember && t.counterparty) await sb.from("payee_memory").upsert({ payee: normPayee(t.counterparty), kind: pick.kind, budget_id: pick.budget_id, commitment_id: pick.commitment_id, taught_at: new Date().toISOString() });
  toast(`Moved to ${pick.text}`, async () => { await sb.from("transactions").update(prev).eq("id", id); if (remember && t.counterparty) await sb.from("payee_memory").delete().eq("payee", normPayee(t.counterparty)); });
  refresh();
}
// Anything that fits no budget or commitment: say in your own words what it was; it counts under Other.
async function describe(id) {
  const t = D.txs.find((x) => x.id === id);
  const what = prompt("What was it?", t.label || "");
  if (!what || !what.trim()) return;
  const prev = { kind: t.kind, budget_id: t.budget_id, commitment_id: t.commitment_id, label: t.label, confirmed: t.confirmed, confidence: t.confidence };
  closeSheet();
  const { error } = await sb.from("transactions").update({ kind: "spend", budget_id: "other", commitment_id: null, label: what.trim(), confirmed: true, confidence: 1 }).eq("id", id);
  if (error) return alert("Couldn't save: " + error.message);
  toast(`Saved as “${what.trim()}”`, () => sb.from("transactions").update(prev).eq("id", id));
  refresh();
}
async function delTx(id) {
  const t = D.txs.find((x) => x.id === id);
  closeSheet();
  await sb.from("transactions").delete().eq("id", id).eq("source", "me");
  const copy = { kind: t.kind, budget_id: t.budget_id, commitment_id: t.commitment_id, amount: t.amount, fee: t.fee, counterparty: t.counterparty, label: t.label, source: "me", confirmed: true, occurred_at: t.occurred_at, note: t.note };
  toast("Entry deleted", () => sb.from("transactions").insert(copy));
  refresh();
}

function openReview() {
  const list = D.txs.filter((t) => !t.confirmed);
  openSheet(`<div class="title"><div class="l"><h3>Needs a tap</h3><div class="sub">Tap one to say what it was</div></div></div><div style="margin-top:8px">${grouped(list, "All sorted.")}</div>`);
}
function openWeek() {
  const C = compute();
  const list = D.cycTx.filter((t) => t.kind === "spend" && new Date(t.occurred_at) >= C.weekStart);
  const wk = C.weeks.map((w) => {
    const tone = w.future ? "" : w.left < 0 ? "bad" : w.left < w.allow * 0.2 ? "warn" : "good";
    const right = w.future ? `<span style="color:var(--sub)">≈ ${fmt(w.allow)}</span>` : `<span class="${tone}">${w.left >= 0 ? fmt(w.left) + " left" : fmt(-w.left) + " over"}</span>`;
    return `<div class="row" style="padding:9px 0"><div class="l"><div class="t" style="font-weight:${w.current ? 700 : 500}">Week ${w.no}${w.current ? " · now" : ""}</div>
      <div class="s">${dshort(w.ws)} – ${dshort(addDays(w.we, -1))}${w.future ? " · if you spend nothing more before then" : ` · ${fmt(w.spent)} of ${fmt(w.allow)}`}</div></div><div class="r">${right}</div></div>`;
  }).join("");
  openSheet(`<div class="title"><div class="l"><h3>This week's spending</h3><div class="sub">${dshort(C.weekStart)} – ${dshort(addDays(C.weekEnd, -1))} · ${fmt(C.week)} of ${fmt(C.allowance)}${C.left >= 0 ? "" : " · over by " + fmt(-C.left)}</div></div></div>
    <div class="lbl">How the month is spread</div>
    <div class="sub" style="font-size:12px;margin:-4px 0 6px">Each week gets an even share of what's still unspent. Spend less and the rest flows into the next weeks; overspend and they absorb it.</div>
    <div style="margin:0 -2px">${wk}</div>
    <div class="lbl">This week</div>
    <div>${grouped(list, "Nothing spent yet this week.")}</div>`);
}
function openBudget(id) {
  const b = id === "_" ? { name: "Unsorted", icon: "❔" } : D.budgets.find((x) => x.id === id);
  const list = D.cycTx.filter((t) => t.kind === "spend" && (t.budget_id || "_") === id);
  const sum = list.reduce((s, t) => s + spendOf(t), 0);
  openSheet(`<div class="title"><div class="ico">${esc(b.icon || "•")}</div><div class="l"><h3>${esc(b.name)}</h3><div class="sub">${list.length} this cycle · tap one to move it</div></div><div class="amt">${fmt(sum)}</div></div>
    <div style="margin-top:8px">${grouped(list, "Nothing yet.")}</div>`);
}

function tapCommit(id) {
  const c = D.commitments.find((x) => x.id === id);
  const ps = D.cycTx.filter((t) => t.kind === "commitment" && t.commitment_id === id);
  if (!ps.length) {
    openSheet(`<div class="title"><div class="ico">✅</div><div class="l"><h3>${esc(c.name)}</h3><div class="sub">Mark as paid this cycle — for cash or anything the bank didn't text about.</div></div></div>
      <div class="lbl">Amount</div><input id="camt" type="number" inputmode="decimal" value="${c.amount}">
      <button class="pbtn" onclick="markPaid('${id}')">Mark paid</button>`);
    return;
  }
  const mine = ps.every((t) => t.source === "me");
  openSheet(`<div class="title"><div class="ico">✅</div><div class="l"><h3>${esc(c.name)}</h3><div class="sub">Paid ${fmt(ps.reduce((s, t) => s + Number(t.amount), 0))} of ${fmt(c.amount)} planned</div></div></div>
    <div style="margin-top:8px">${grouped(ps, "")}</div>
    ${mine ? `<button class="pbtn ghost" onclick="unmark('${id}')">Untick</button>` : `<div class="sub" style="margin-top:12px">Came from the bank — tap the payment above to move it if it's wrong.</div>`}`);
}
async function markPaid(id) {
  const amount = Number($("camt").value);
  closeSheet();
  if (!(amount > 0)) return;
  haptic();
  const { data } = await sb.from("transactions").insert({ kind: "commitment", commitment_id: id, amount, source: "me", confirmed: true, counterparty: "Marked paid", occurred_at: new Date().toISOString() }).select("id").single();
  toast("Marked paid", () => sb.from("transactions").delete().eq("id", data?.id));
  refresh();
}
async function unmark(id) {
  closeSheet();
  const rows = D.cycTx.filter((t) => t.kind === "commitment" && t.commitment_id === id && t.source === "me");
  await sb.from("transactions").delete().in("id", rows.map((r) => r.id));
  toast("Unticked", () => sb.from("transactions").insert(rows.map((t) => ({ kind: "commitment", commitment_id: id, amount: t.amount, source: "me", confirmed: true, counterparty: t.counterparty, occurred_at: t.occurred_at }))));
  refresh();
}

let addBudget = null;
function openAdd() {
  addBudget = D.budgets[0]?.id;
  openSheet(`<div class="title"><div class="l"><h3>Add a spend</h3><div class="sub">For cash or anything the bank didn't text about.</div></div></div>
    <div class="lbl">Amount</div><input id="aamt" type="number" inputmode="decimal" placeholder="0">
    <div class="lbl">What</div><input id="anote" placeholder="e.g. Coffee">
    <div class="lbl">Budget</div><div class="opts" id="abud">${D.budgets.map((b) =>
      `<button class="opt ${b.id === addBudget ? "sel" : ""}" onclick="addBudget='${b.id}';document.querySelectorAll('#abud .opt').forEach(e=>e.classList.remove('sel'));this.classList.add('sel');haptic()"><span>${esc(b.icon || "")}</span>${esc(b.name)}</button>`).join("")}</div>
    <button class="pbtn" onclick="saveAdd()">Add</button>`);
  setTimeout(() => $("aamt").focus(), 250);
}
async function saveAdd() {
  const amount = Number($("aamt").value), note = $("anote").value.trim();
  if (!(amount > 0)) return;
  closeSheet();
  const { data } = await sb.from("transactions").insert({ kind: "spend", amount, budget_id: addBudget, counterparty: note || null, source: "me", confirmed: true, occurred_at: new Date().toISOString() }).select("id").single();
  toast(`Added ${fmt(amount)}`, () => sb.from("transactions").delete().eq("id", data?.id));
  refresh();
}

async function saveSettings() {
  const num = (id) => Number($(id).value);
  const ops = [sb.from("settings").upsert({ key: "salary", value: num("s_salary") })];
  for (const b of D.budgets) ops.push(sb.from("budgets").update({ name: $("bn_" + b.id).value.trim() || b.name, cap: num("bc_" + b.id) }).eq("id", b.id));
  for (const c of D.commitments) ops.push(sb.from("commitments").update({ name: $("cn_" + c.id).value.trim() || c.name, amount: num("ca_" + c.id) }).eq("id", c.id));
  const res = await Promise.all(ops);
  const err = res.find((r) => r.error);
  if (err) return alert("Couldn't save: " + err.error.message);
  toast("Settings saved");
  refresh();
}
async function changePassword() {
  const pw = prompt("New password (at least 6 characters)");
  if (!pw) return;
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? "Couldn't change it: " + error.message : "Password changed.");
}

// ---------- feel: toast + undo, haptics, pull to refresh ----------
let toastTimer = null;
function toast(msg, undoFn) {
  undoStack = undoFn ? { fn: undoFn } : null;
  $("toastMsg").textContent = msg; $("toastBtn").hidden = !undoFn;
  $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), 6000);
}
async function undo() {
  const u = undoStack; undoStack = null; $("toast").classList.remove("on");
  if (!u) return;
  try { await u.fn(); } catch (e) { alert("Couldn't undo: " + e.message); }
  refresh();
}
// iOS gives a real haptic tick when a switch-style checkbox toggles; other platforms ignore it.
function haptic() { try { $("hapt").click(); } catch {} }
let ptrY = null;
window.addEventListener("touchstart", (e) => { ptrY = window.scrollY <= 0 && !$("sheet").classList.contains("on") ? e.touches[0].clientY : null; }, { passive: true });
window.addEventListener("touchmove", (e) => { if (ptrY === null) return; const d = e.touches[0].clientY - ptrY; $("ptr").style.height = d > 70 ? "28px" : "0"; }, { passive: true });
window.addEventListener("touchend", async (e) => { if (ptrY === null) return; const show = $("ptr").style.height !== "0px" && $("ptr").style.height !== ""; ptrY = null; $("ptr").style.height = "0"; if (show) { haptic(); await refresh(); toast("Refreshed"); } });

// ---------- auth ----------
function renderLogin(msg = "") {
  $("tabs").hidden = true;
  $("app").innerHTML = `<div class="login"><h1>Saad Money</h1><div class="sub" style="color:var(--sub)">Sign in to see your numbers.</div>
    <input id="em" type="email" autocomplete="username" placeholder="Email">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <button class="pbtn" onclick="signIn()">Sign in</button>
    <button class="pbtn ghost" onclick="signUp()">First time? Create account</button>
    <div class="msg" id="msg">${esc(msg)}</div></div>`;
}
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) return ($("msg").textContent = error.message);
  start();
}
async function signUp() {
  const { error } = await sb.auth.signUp({ email: $("em").value.trim(), password: $("pw").value });
  $("msg").textContent = error ? error.message : "Account created. Confirm it from the email (or ask Claude to), then sign in.";
}

// ---------- boot ----------
let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try { await load(); if (!D.accounts.length) return renderLogin("This login has no access."); render(); }
  catch (e) { console.error(e); }
  finally { refreshing = false; }
}
async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return renderLogin();
  $("app").innerHTML = `<div class="login"><div class="sub" style="color:var(--sub)">Loading…</div></div>`;
  await refresh();
  sb.channel("tx").on("postgres_changes", { event: "*", schema: "public", table: "transactions" }, () => { refresh(); }).subscribe();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && D) { refresh(); checkBuild(); } });
setInterval(() => { if (D && tab !== "home" && !$("sheet").classList.contains("on")) { const s = document.querySelector(".sync"); if (s) s.textContent = syncText(); } }, 15000);

// A home-screen app keeps its old HTML forever; tell the user when a newer build is live.
async function checkBuild() {
  try {
    const src = await (await fetch("index.html?_=" + Date.now(), { cache: "no-store" })).text();
    const live = src.match(/^const BUILD = "([^"]+)"/m)?.[1];
    if (live && live !== BUILD && !$("upd")) {
      document.body.insertAdjacentHTML("beforeend", `<button id="upd" class="updbanner" onclick="location.href='./?v='+Date.now()">New version — tap to update</button>`);
    }
  } catch {}
}
start();
checkBuild();
</script>
</body>
